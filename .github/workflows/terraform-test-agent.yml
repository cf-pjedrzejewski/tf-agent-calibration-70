name: Terraform test agent

on:
  pull_request:
    paths:
      - "modules/**/*.tf"
      - "modules/**/*.tftest.hcl"
      - ".github/agents/**"
      - ".github/skills/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  test-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION || '1.9.8' }}
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: >-
            Read .github/agents/terraform-test-agent.md and the skill it names.
            Inspect the pull request diff, update tests for changed Terraform
            modules when appropriate, and run terraform test for those modules.